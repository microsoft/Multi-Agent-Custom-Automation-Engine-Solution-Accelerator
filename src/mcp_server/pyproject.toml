[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "macae-mcp-server"
description = "FastMCP-based Model Context Protocol (MCP) server for the MACAE solution accelerator"
readme = "README.md"
# Igual que la imagen (python:3.11) y que el backend. Con ">=3.10" el lock
# mantenía un fork para 3.10 donde mcp no pasa de 1.27.2, y Dependabot
# reportaba la corrección de seguridad de mcp (>=1.28.1) como imposible.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Microsoft MACAE Team" }
]
dynamic = ["version"]

# Core runtime dependencies (kept in sync with requirements.txt)
# FastMCP 3.1+ for MCP Protocol 2025-11-25 with UI Resources support
dependencies = [
  "fastmcp>=3.2.0,<4",
  "uvicorn[standard]>=0.38.0,<1",
  "python-dotenv>=1.2.2,<2",
  "azure-identity>=1.19.0,<2",
  "azure-keyvault-secrets>=4.11.0,<5",
  # Required async transport for azure.*.aio (ManagedIdentityCredential token
  # minting + Key Vault reads in credential_resolver). Without it azure-core
  # raises "aiohttp package is not installed" and the MI token is never obtained
  # → the request goes out with no Authorization header → 401.
  "aiohttp>=3.14.3,<4",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.6.1,<3",
  "python-multipart>=0.0.31,<1",
  "httpx>=0.28.1,<1",
  "werkzeug>=3.1.6,<4",
  "urllib3>=2.7.0,<3",
  "azure-core>=1.38.0,<2",
  "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.24.0,<1",
  "mypy>=1.19.1,<2",
  "ruff>=0.15.7,<0.16",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
check_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
preview = true


[project.urls]
Homepage = "https://github.com/microsoft/Multi-Agent-Custom-Automation-Engine-Solution-Accelerator"
Repository = "https://github.com/microsoft/Multi-Agent-Custom-Automation-Engine-Solution-Accelerator"

# Version is sourced from the package __init__.py
[tool.hatch.version]
path = "__init__.py"

# Hatch build configuration. Since this folder is itself the package root,
# include everything under it (no src/ layout).
[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["**/*", "README.md"]

[project.scripts]
mcp-server = "mcp_server:main"
inspector-cli = "inspector_cli:main"
