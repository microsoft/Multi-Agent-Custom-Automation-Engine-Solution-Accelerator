[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-ai-evaluation>=1.11.0,<2",
    "azure-ai-inference>=1.0.0b9,<2",
    "azure-ai-projects>=2.0.0,<3",
    "azure-cosmos>=4.9.0,<5",
    "azure-identity>=1.24.0,<2",
    "azure-monitor-events-extension>=0.1.0,<1",
    "azure-monitor-opentelemetry>=1.8.5,<2",
    "azure-search-documents>=11.5.3,<12",
    "fastapi>=0.116.1,<1",
    # Importada directamente (middleware/health_check.py); declarada para que
    # Dependabot la trate como directa y no como transitiva de fastapi. Piso =
    # versión actual del lock: declararla no mueve nada, la mueve Dependabot.
    "starlette>=0.47.3,<2",
    "openai>=2.16.0,<3",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
    "opentelemetry-instrumentation-openai>=0.46.2,<1",
    "opentelemetry-sdk>=1.39.0,<2",
    "python-dotenv>=1.2.2,<2",
    "python-multipart>=0.0.31,<1",
    # Runtime (no sólo dev): motor de diagnósticos Python del editor Monaco
    # (POST /workspace/{id}/diagnostics). Binario único, sin deps Python.
    "ruff>=0.15.7,<0.16",
    "uvicorn[standard]>=0.35.0,<1",
    "pylint-pydantic>=0.3.5,<1",
    "pexpect>=4.9.0,<5",
    "mcp>=1.30.0,<2",
    "werkzeug>=3.1.9,<4",
    "azure-core>=1.38.0,<2",
    # agent-framework: el código está escrito contra la línea rc6; la migración
    # a 1.x es manual por rama (API distinta: Message, AzureOpenAIChatClient…).
    # Fijos a propósito; el resto son rangos hasta el siguiente major.
    "agent-framework-azure-ai==1.0.0rc6",
    "agent-framework-core==1.0.0rc6",
    "agent-framework-orchestrations==1.0.0b260311",
    "urllib3>=2.8.0,<3",
    "protobuf>=5.29.6,<6",
    "cryptography>=50.0.0,<51",
    "aiohttp>=3.14.4,<4",
    "pyasn1>=0.6.4,<1",
    "nltk>=3.10.4,<4",
    "httpx>=0.27.0,<1",
    "azure-keyvault-secrets>=4.11.0,<5",
    "agent-framework-openai==1.0.0rc6",
    "azure-storage-blob>=12.27.1,<13",
    "azure-ai-voicelive>=1.3.0,<2",
]

[tool.mypy]
python_version = "3.11"
# Anclado al pyproject (no al cwd) para que el editor y el gate resuelvan
# igual desde cualquier directorio. La raíz de tests entra al path para que
# los tests tengan nombre de paquete (backend.*, agents.*) y el override de
# abajo pueda alcanzarlos; sin ella serían módulos sueltos sin patrón válido.
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../tests"
explicit_package_bases = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["azure.functions", "azure.monitor.events.extension"]
ignore_missing_imports = true

# Tests monkeypatchean métodos por asignación directa en cientos de sitios;
# method-assign es señal de producto, no de harness. El producto (v4, common,
# app) sigue estricto — estos patrones sólo alcanzan src/tests (no hay
# paquetes backend/agents/contract en el código de producción del backend).
[[tool.mypy.overrides]]
module = ["backend.*", "agents.*", "contract.*", "conftest"]
disable_error_code = ["method-assign"]

[tool.fastapi]
entrypoint = "app:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W","UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends", "fastapi.Body", "fastapi.Form", "fastapi.Header", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2",
    "pytest>=8.4.1,<10",  # schemathesis exige pytest>=9 en 3.13
    # 1.4+: 0.24 fugaba un event loop "de repuesto" por test (destapado por el
    # gate error::ResourceWarning en pytest.ini)
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=5.0.0,<6",
    # <0.16: la 0.16 amplió el set de reglas por defecto (+178 hallazgos);
    # se adopta vía PR de dependabot evaluando esos hallazgos, no de contrabando
    "ruff>=0.15.7,<0.16",
    "types-regex",
    "types-python-dateutil",
    "types-requests",
    # API/schema contract testing (OpenAPI/GraphQL)
    "schemathesis>=4.24.3,<5",
    # Record/replay HTTP interactions in tests
    "pytest-recording>=0.13.4,<1",
    # Mock httpx requests in unit tests
    "respx>=0.23.1,<1",
    "types-pyyaml>=6.0.12.20260815,<7",
    # docs/incidents/probes/plan_lane_e2e_probe.py abre el WS del plan; antes
    # sólo llegaba transitivo vía uvicorn[standard]
    "websockets>=17.0.1,<18",
    # El registro de incidentes se valida contra docs/incidents/schema en los
    # tests. Llegaba sólo como transitiva; declararla la vuelve directa para
    # Dependabot y evita que el gate del registro dependa de una cadena ajena.
    "jsonschema>=4.25.1,<5",
]
