[pytest]
addopts = -p pytest_asyncio --import-mode=importlib
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Async resource-lifecycle gate: aiohttp/asyncio report leaked sessions,
# connectors and transports as ResourceWarning at GC — as errors, the test
# that leaked FAILS instead of the leak hiding until it explodes in prod.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
testpaths =
    src/tests/backend
    src/tests/agents
markers =
    integration: marks tests as integration tests requiring real Azure infrastructure (deselect with '-m "not integration"')
    unit: marks tests as fast unit tests with no external dependencies
    e2e: marks tests as end-to-end Playwright tests requiring a running frontend
    integration: marks tests as integration tests requiring real Azure backend + credentials
